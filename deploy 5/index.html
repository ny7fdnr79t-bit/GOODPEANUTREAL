:absolute;top:0;right:0;bottom:0;width:min(74%,1080px)\"><\u002Fpeanut-house>\n    <div data-m=\"heroScrim\" style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#17203a 0%,rgba(23,32,58,.94) 32%,rgba(23,32,58,.4) 54%,rgba(23,32,58,0) 70%)\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;padding:76px 24px;pointer-events:none\" data-m=\"hero\">\n      <div style=\"max-width:660px;pointer-events:auto\" data-m=\"heroCopy\">\n        <div style=\"display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;border:1px solid rgba(246,247,249,.22);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:26px;animation:pn-rise .6s ease both\">\n          <span style=\"width:7px;height:7px;border-radius:999px;background:#f5b13f;animation:pn-pulse 2s infinite\"><\u002Fspan>\n          Property prep, start to sold\n        <\u002Fdiv>\n        <div style=\"font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#f5b13f;margin-bottom:14px;animation:pn-rise .6s ease .08s both\">What we specialize in<\u002Fdiv>\n        <h1 style=\"color:#f6f7f9;font-size:clamp(46px,7.2vw,96px);line-height:.94;letter-spacing:-.015em;margin-bottom:26px;max-width:15ch;animation:pn-rise .7s ease .16s both\">Making the property <span style=\"color:#f5b13f\">worth more.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size:21px;line-height:1.5;color:rgba(246,247,249,.76);max-width:46ch;margin-bottom:34px;animation:pn-rise .7s ease .26s both\">Flooring, paint, clear-outs and staging, spent only where a buyer and an appraiser will see it. You send one video walkthrough. We scope it, book it, run it, and hand back a house that lists for more than it would have.<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;animation:pn-rise .7s ease .34s both\">\n          <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Send a walkthrough<\u002Fa>\n          <a href=\"#/contact\" class=\"btn\" style=\"text-decoration:none;color:#f6f7f9;border-color:rgba(246,247,249,.3)\" style-hover=\"background:rgba(246,247,249,.1)\">Book a call<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:34px;flex-wrap:wrap;margin-top:40px;padding-top:28px;border-top:1px solid rgba(246,247,249,.14);animation:pn-rise .7s ease .42s both\">\n          <div><div style=\"font-family:var(--font-heading);font-size:34px;color:#f6f7f9;line-height:1\">2.9×<\u002Fdiv><div style=\"font-size:15px;color:rgba(246,247,249,.58);margin-top:4px\">Return on prep spend<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:34px;color:#f6f7f9;line-height:1\">11 days<\u002Fdiv><div style=\"font-size:15px;color:rgba(246,247,249,.58);margin-top:4px\">Median start to keys back<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:34px;color:#f6f7f9;line-height:1\">140<\u002Fdiv><div style=\"font-size:15px;color:rgba(246,247,249,.58);margin-top:4px\">Properties finished last year<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#121a2e;color:#f6f7f9;border-top:1px solid rgba(246,247,249,.09)\">\n    <div style=\"max-width:900px;margin:0 auto;padding:66px 24px 78px\" data-m=\"pad\">\n      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:14px\">\n        <img src=\"48786958-715d-40d2-a221-96611f6d0cbb\" alt=\"\" style=\"height:20px;width:auto\">\n        <span style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,247,249,.58)\">Instant scope<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"color:#f6f7f9;margin-bottom:10px\">Describe the property. Get the plan.<\u002Fh2>\n      <p style=\"color:rgba(246,247,249,.7);max-width:56ch;margin-bottom:26px\">One or two sentences is enough. You will see what the place needs, the order the trades go in, and roughly how long it takes, before you talk to anybody.<\u002Fp>\n      <textarea class=\"input\" placeholder=\"e.g. My mother's bungalow in Scarborough. Forty years of contents, carpet everywhere, kitchen is original. Listing in six weeks.\" value=\"{{ askText }}\" sc-camel-on-change=\"{{ onAskText }}\" style=\"background:rgba(246,247,249,.07);border-color:rgba(246,247,249,.2);color:#f6f7f9;width:min(100%,440px);aspect-ratio:1;min-height:0;border-radius:32px;padding:22px 24px;resize:none\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onAsk }}\" disabled=\"{{ askBusy }}\">{{ askLabel }}<\u002Fbutton>\n        <button class=\"btn\" sc-camel-on-click=\"{{ onAskExample }}\" style=\"color:#f6f7f9;border-color:rgba(246,247,249,.28)\" style-hover=\"background:rgba(246,247,249,.1)\">Use an example<\u002Fbutton>\n        <span style=\"font-size:15px;color:rgba(246,247,249,.45)\">No email needed.<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ askErr }}\">\n        <p style=\"margin-top:20px;color:#fbd48a\">{{ askErr }}<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ askResult }}\">\n        <div style=\"margin-top:34px;padding:34px;border-radius:32px;background:rgba(246,247,249,.06);border:1px solid rgba(246,247,249,.15);animation:pn-rise .5s ease both\">\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px\">\n            <span class=\"tag\" style=\"background:#f5b13f;color:#17203a;font-size:14px;padding:6px 16px\">{{ askResult.who }}<\u002Fspan>\n            <span class=\"tag\" style=\"background:rgba(246,247,249,.12);color:#f6f7f9;font-size:14px;padding:6px 16px\">{{ askResult.plan }}<\u002Fspan>\n            <span class=\"tag\" style=\"background:rgba(246,247,249,.12);color:#f6f7f9;font-size:14px;padding:6px 16px\">{{ askResult.duration }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"color:#f6f7f9;margin-bottom:20px;max-width:28ch\">{{ askResult.headline }}<\u002Fh3>\n          <div style=\"display:grid;gap:0\">\n            <sc-for list=\"{{ askResult.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:40px 1fr auto;gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(246,247,249,.13)\">\n                <span style=\"font-family:var(--font-heading);font-size:21px;color:#f5b13f\">{{ s.n }}<\u002Fspan>\n                <div>\n                  <div style=\"font-weight:700;font-size:17px;margin-bottom:3px\">{{ s.trade }}<\u002Fdiv>\n                  <div style=\"color:rgba(246,247,249,.68);font-size:16px\">{{ s.what }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:14px;color:rgba(246,247,249,.5);white-space:nowrap\">{{ s.days }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:20px 0 0;padding-top:20px;border-top:1px solid rgba(246,247,249,.13);color:rgba(246,247,249,.7);font-size:16px\">{{ askResult.watch }}<\u002Fp>\n          <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:26px\">\n            <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Send the walkthrough<\u002Fa>\n            <a href=\"{{ askResult.route }}\" class=\"btn\" style=\"text-decoration:none;color:#f6f7f9;border-color:rgba(246,247,249,.28)\" style-hover=\"background:rgba(246,247,249,.1)\">{{ askResult.routeLabel }}<\u002Fa>\n          <\u002Fdiv>\n          <p style=\"margin:20px 0 0;font-size:14px;color:rgba(246,247,249,.4)\">Written by Peanut's assistant from what you typed. A project manager confirms everything before anything is booked or charged.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:88px 24px 0\" data-m=\"pad\">\n    <h2 style=\"max-width:20ch;margin-bottom:12px\">Four ways in. One crew behind them.<\u002Fh2>\n    <p class=\"text-muted\" style=\"max-width:54ch;margin-bottom:40px\">Whoever sends us the property, the homeowner is the one who sees and controls everything.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px\">\n      <a href=\"#/how\" class=\"card elev-sm\" style=\"text-decoration:none;color:inherit;padding:30px;gap:12px;background:#fff\" style-hover=\"box-shadow:var(--shadow-lg);transform:translateY(-3px)\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Homeowner<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:23px\">Selling the family home<\u002Fspan>\n        <p class=\"card-body\" style=\"font-size:16px\">You do not want to meet five contractors. You want one number and a date.<\u002Fp>\n        <span style=\"color:var(--color-accent-700);font-weight:700;font-size:15px\">How it works →<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#/refer\" class=\"card elev-sm\" style=\"text-decoration:none;color:inherit;padding:30px;gap:12px;background:#fff\" style-hover=\"box-shadow:var(--shadow-lg);transform:translateY(-3px)\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Real estate agent<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:23px\">Refer it, stay in the loop<\u002Fspan>\n        <p class=\"card-body\" style=\"font-size:16px\">Your client runs the job on their own page. You get the listing back on time.<\u002Fp>\n        <span style=\"color:var(--color-accent-700);font-weight:700;font-size:15px\">Refer a client →<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#/estates\" class=\"card elev-sm\" style=\"text-decoration:none;color:inherit;padding:30px;gap:12px;background:#fff\" style-hover=\"box-shadow:var(--shadow-lg);transform:translateY(-3px)\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Estate broker<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:23px\">A house full of decisions<\u002Fspan>\n        <p class=\"card-body\" style=\"font-size:16px\">Contents catalogued and photographed before anything leaves the property.<\u002Fp>\n        <span style=\"color:var(--color-accent-700);font-weight:700;font-size:15px\">Contents protocol →<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#/estates\" class=\"card elev-sm\" style=\"text-decoration:none;color:inherit;padding:30px;gap:12px;background:#fff\" style-hover=\"box-shadow:var(--shadow-lg);transform:translateY(-3px)\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Lawyer<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:23px\">Records that hold up<\u002Fspan>\n        <p class=\"card-body\" style=\"font-size:16px\">Hand it to the executor and let them drive. Dated photos and itemised invoices land in one file.<\u002Fp>\n        <span style=\"color:var(--color-accent-700);font-weight:700;font-size:15px\">For estates &amp; counsel →<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:88px 24px\" data-m=\"pad\">\n    <h2 style=\"margin-bottom:40px\">Five stages, and your client sees all of them.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:18px\">\n      <div style=\"padding:26px;border-radius:28px;background:var(--color-accent-100)\">\n        <div style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent);color:#17203a;display:grid;place-items:center;font-family:var(--font-heading);font-size:21px;margin-bottom:16px\">1<\u002Fdiv>\n        <h4 style=\"margin-bottom:6px\">Scoped<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-900)\">We watch the walkthrough and write the plan. 24 hours.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:28px;background:var(--color-accent-2-100)\">\n        <div style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent-2-700);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-size:21px;margin-bottom:16px\">2<\u002Fdiv>\n        <h4 style=\"margin-bottom:6px\">Booked<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-2-900)\">Trades confirmed in sequence. You see who and when.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:28px;background:var(--color-accent-100)\">\n        <div style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent);color:#17203a;display:grid;place-items:center;font-family:var(--font-heading);font-size:21px;margin-bottom:16px\">3<\u002Fdiv>\n        <h4 style=\"margin-bottom:6px\">In progress<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-900)\">Photos at the end of every working day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:28px;background:var(--color-accent-2-100)\">\n        <div style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent-2-700);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-size:21px;margin-bottom:16px\">4<\u002Fdiv>\n        <h4 style=\"margin-bottom:6px\">Punch list<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;color:var(--color-accent-2-900)\">We find the misses before the buyer does.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:28px;background:var(--color-neutral-200)\">\n        <div style=\"width:46px;height:46px;border-radius:999px;background:var(--color-neutral-800);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-size:21px;margin-bottom:16px\">5<\u002Fdiv>\n        <h4 style=\"margin-bottom:6px\">Ready<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;color:var(--color-neutral-900)\">Keys back, one invoice, house on the market.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--color-surface)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:80px 24px\" data-m=\"pad\">\n      <h2 style=\"max-width:20ch;margin-bottom:10px\">Where the money goes, and what it comes back as.<\u002Fh2>\n      <p class=\"text-muted\" style=\"max-width:54ch;margin-bottom:36px\">Our median eleven-day Refresh, line by line. We turn down work that does not pay for itself.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;align-items:start\">\n        <div class=\"card elev-md\" style=\"padding:8px 30px 26px;background:#fff;gap:0\">\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;padding:18px 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700)\">\n            <span>Work<\u002Fspan><span style=\"text-align:right\">Spend<\u002Fspan><span style=\"text-align:right;min-width:78px\">Adds<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">Contents clear-out<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">Rooms read at their real size<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:17px;text-align:right\">$2,400<\u002Fspan><span style=\"font-size:17px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$9,000<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">Interior paint, full<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">The single highest-return line we book<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:17px;text-align:right\">$4,100<\u002Fspan><span style=\"font-size:17px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$12,000<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">Flooring, main level<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">Carpet out, engineered oak through<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:17px;text-align:right\">$6,800<\u002Fspan><span style=\"font-size:17px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$15,000<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">Kitchen refresh<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">Doors, counters, hardware. Never a gut.<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:17px;text-align:right\">$9,500<\u002Fspan><span style=\"font-size:17px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$21,000<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">Staging, six weeks<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">Furnished to the buyer this street attracts<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:17px;text-align:right\">$3,200<\u002Fspan><span style=\"font-size:17px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$18,000<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:baseline;padding:18px 0 6px;border-top:2px solid var(--color-text)\">\n            <div style=\"font-size:18px;font-weight:700\">Typical Refresh<\u002Fdiv>\n            <span style=\"font-size:18px;font-weight:700;text-align:right\">$26,000<\u002Fspan><span style=\"font-size:18px;text-align:right;font-weight:700;color:var(--color-accent-2-700);min-width:78px\">+$75,000<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:20px\">\n          <div style=\"padding:34px;border-radius:32px;background:#17203a;color:#f6f7f9\">\n            <div style=\"font-family:var(--font-heading);font-size:64px;color:#f5b13f;line-height:1\">2.9×<\u002Fdiv>\n            <p style=\"margin:12px 0 0;font-size:17px;color:rgba(246,247,249,.74)\">Median return on prep spend across the 140 properties we finished last year.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:34px;border-radius:32px;background:var(--color-accent-2-100)\">\n            <div style=\"font-family:var(--font-heading);font-size:64px;color:var(--color-accent-2-800);line-height:1\">19 d<\u002Fdiv>\n            <p style=\"margin:12px 0 0;font-size:17px;color:var(--color-accent-2-900)\">Faster to firm offer than comparable unprepped listings on the same street.<\u002Fp>\n          <\u002Fdiv>\n          <p class=\"text-muted\" style=\"margin:0;font-size:15px\">Figures are Peanut medians, not a guarantee. Your appraiser and your market will move them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:88px 24px\" data-m=\"pad\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:48px;align-items:center\">\n      <div>\n        <h2 style=\"max-width:17ch;margin-bottom:16px\">One invoice. One contact. One place to look.<\u002Fh2>\n        <p style=\"font-size:19px;max-width:47ch;margin-bottom:26px\">Every property gets its own page. Stage, trades on site, cost to date, daily photos, and the name and number of the person running it. The homeowner holds the link and can forward it to anyone.<\u002Fp>\n        <a href=\"#/track\" class=\"btn btn-primary\" style=\"text-decoration:none\">See a live property page<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"card elev-md\" style=\"padding:30px;gap:16px;background:#fff\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Property PN-4471<\u002Fspan><span class=\"tag tag-accent-2\">In progress<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:24px\">18 Harcourt Ave<\u002Fdiv>\n        <div style=\"height:10px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden\">\n          <div style=\"width:62%;height:100%;background:var(--color-accent)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:15px\" class=\"text-muted\"><span>Day 7 of 11<\u002Fspan><span>Target Oct 2<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:0;margin-top:6px\">\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--color-divider);font-size:16px\"><span>Clear-out<\u002Fspan><span class=\"text-muted\">Done<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--color-divider);font-size:16px\"><span>Paint — Marchetti<\u002Fspan><span style=\"color:var(--color-accent-700);font-weight:700\">On site<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--color-divider);font-size:16px\"><span>Flooring — Bellwood<\u002Fspan><span class=\"text-muted\">Sep 30<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRefer }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 16px;max-width:17ch\">Refer the client. They take it from there.<\u002Fh1>\n  <p style=\"font-size:20px;max-width:54ch;margin-bottom:48px\">You do not become the project manager. Send us the property, and your client gets their own page with the scope, the trades, the photos and the invoice. You keep the relationship and the listing date.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:20px;margin-bottom:64px\">\n    <div style=\"padding:34px;border-radius:32px;background:#17203a;color:#f6f7f9\">\n      <div style=\"font-family:var(--font-heading);font-size:56px;color:#f5b13f;line-height:1\">24h<\u002Fdiv>\n      <div style=\"font-size:17px;margin-top:10px;color:rgba(246,247,249,.74)\">Scope and quote back, from the moment we have the walkthrough.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:34px;border-radius:32px;background:#17203a;color:#f6f7f9\">\n      <div style=\"font-family:var(--font-heading);font-size:56px;color:#f5b13f;line-height:1\">72h<\u002Fdiv>\n      <div style=\"font-size:17px;margin-top:10px;color:rgba(246,247,249,.74)\">First trade on site after your client accepts. Sooner if the property is empty.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:34px;border-radius:32px;background:#17203a;color:#f6f7f9\">\n      <div style=\"font-family:var(--font-heading);font-size:56px;color:#f5b13f;line-height:1\">10d<\u002Fdiv>\n      <div style=\"font-size:17px;margin-top:10px;color:rgba(246,247,249,.74)\">Median time from accepted quote to keys back on a Refresh.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <h2 style=\"margin-bottom:28px\">What the referral actually involves<\u002Fh2>\n  <div style=\"margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:52px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-600)\">1<\u002Fspan><div><h4 style=\"margin-bottom:4px\">Send the address and your client's name<\u002Fh4><p style=\"margin:0;font-size:17px\">Thirty seconds. If they can film a walkthrough, even better.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:52px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-600)\">2<\u002Fspan><div><h4 style=\"margin-bottom:4px\">We deal with your client directly<\u002Fh4><p style=\"margin:0;font-size:17px\">They approve the scope, they choose what to skip, they pay the invoice. You are copied, not chased.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:52px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-600)\">3<\u002Fspan><div><h4 style=\"margin-bottom:4px\">Everyone watches the same page<\u002Fh4><p style=\"margin:0;font-size:17px\">The tracking link answers the \"how is it going\" call before it happens.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:44px;border-radius:32px;background:var(--color-accent-2-100)\">\n    <h3 style=\"margin-bottom:10px\">Referring more than one property a month?<\u002Fh3>\n    <p style=\"font-size:17px;max-width:54ch;color:var(--color-accent-2-900)\">You get a named project manager, a standing slot in the trade calendar, and a single monthly summary of everything in flight.<\u002Fp>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:12px\">\n      <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Refer a property<\u002Fa>\n      <a href=\"#/contact\" class=\"btn btn-secondary\" style=\"text-decoration:none\">Book a call<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEstates }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 16px;max-width:18ch\">Nothing leaves the property unrecorded.<\u002Fh1>\n  <p style=\"font-size:20px;max-width:56ch;margin-bottom:48px\">Executors and counsel need more than a clean house. They need to show what was there, what happened to it, and who signed off. Hand us the property and hand the executor the page.<\u002Fp>\n  <h2 style=\"margin-bottom:26px\">Contents protocol<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px;margin-bottom:64px\">\n    <div class=\"card elev-sm\" style=\"padding:28px;background:#fff\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Step one<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Photograph every room<\u002Fspan><p class=\"card-body\" style=\"font-size:16px\">Wide and detail shots, timestamped, before a single box is touched.<\u002Fp><\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"padding:28px;background:#fff\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Step two<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Catalogue anything of value<\u002Fspan><p class=\"card-body\" style=\"font-size:16px\">Jewellery, documents, art, firearms, cash. Listed, bagged, held. Never in a skip.<\u002Fp><\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"padding:28px;background:#fff\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Step three<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Written release before disposal<\u002Fspan><p class=\"card-body\" style=\"font-size:16px\">The executor signs the list. Only then does clearance start.<\u002Fp><\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"padding:28px;background:#fff\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Step four<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Donation and disposal receipts<\u002Fspan><p class=\"card-body\" style=\"font-size:16px\">Everything routed to charity, auction or landfill comes back with paper.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <h2 style=\"margin-bottom:16px\">For lawyers and estate brokers<\u002Fh2>\n  <p style=\"font-size:19px;max-width:56ch;margin-bottom:32px\">Refer it once. The executor drives the work from their own page, and the file closes itself.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px;margin-bottom:56px\">\n    <div style=\"padding:28px;border-radius:28px;border:1px solid var(--color-divider)\"><h4 style=\"margin-bottom:6px\">One file per property<\u002Fh4><p style=\"margin:0;font-size:16px\">Scope, signed approvals, dated photo set, trade invoices, final statement.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:28px;border-radius:28px;border:1px solid var(--color-divider)\"><h4 style=\"margin-bottom:6px\">Itemised, not bundled<\u002Fh4><p style=\"margin:0;font-size:16px\">Each trade billed separately so costs can be allocated against the estate.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:28px;border-radius:28px;border:1px solid var(--color-divider)\"><h4 style=\"margin-bottom:6px\">One contact, named<\u002Fh4><p style=\"margin:0;font-size:16px\">A project manager who answers, and who will put it in writing.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:28px;border-radius:28px;border:1px solid var(--color-divider)\"><h4 style=\"margin-bottom:6px\">Read-only links<\u002Fh4><p style=\"margin:0;font-size:16px\">Forward progress to beneficiaries without giving anyone approval rights.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n    <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Send a walkthrough<\u002Fa>\n    <a href=\"#/contact\" class=\"btn btn-secondary\" style=\"text-decoration:none\">Book a call<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isServices }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 16px;max-width:16ch\">Three packages. Scoped to the house, not the brochure.<\u002Fh1>\n  <p style=\"font-size:20px;max-width:54ch;margin-bottom:48px\">We do not publish prices, because a price without seeing the property is a guess. Send a walkthrough and you get a real number in a day.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:22px;margin-bottom:64px\">\n    <div style=\"padding:36px;border-radius:32px;background:#fff;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px\">\n      <span class=\"tag tag-neutral\" style=\"align-self:flex-start\">Clear<\u002Fspan>\n      <h3>Empty it properly<\u002Fh3>\n      <p style=\"margin:0;font-size:17px\">Full contents removal under the estate protocol, deep clean, minor repairs, junk and hazardous disposal.<\u002Fp>\n      <div class=\"text-muted\" style=\"font-size:16px;margin-top:auto\">Typically 2–4 days<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:36px;border-radius:32px;background:#17203a;color:#f6f7f9;display:flex;flex-direction:column;gap:16px\">\n      <span class=\"tag\" style=\"align-self:flex-start;background:#f5b13f;color:#17203a\">Refresh · most chosen<\u002Fspan>\n      <h3 style=\"color:#f6f7f9\">Make it show well<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;color:rgba(246,247,249,.78)\">Everything in Clear, plus paint throughout, flooring repair or replacement, fixtures, landscaping and light staging.<\u002Fp>\n      <div style=\"font-size:16px;margin-top:auto;color:rgba(246,247,249,.55)\">Typically 8–12 days<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:36px;border-radius:32px;background:#fff;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px\">\n      <span class=\"tag tag-accent\" style=\"align-self:flex-start\">Full Prep<\u002Fspan>\n      <h3>Take it to the top of the street<\u002Fh3>\n      <p style=\"margin:0;font-size:17px\">Everything in Refresh, plus kitchen and bathroom work, permits where needed, full staging and listing photography.<\u002Fp>\n      <div class=\"text-muted\" style=\"font-size:16px;margin-top:auto\">Typically 3–6 weeks<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <h2 style=\"margin-bottom:24px\">The trades we run<\u002Fh2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:56px\">\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Clear-out &amp; disposal<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Deep cleaning<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Painting<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Flooring<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Drywall &amp; plaster<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Electrical<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Plumbing<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Kitchens &amp; baths<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Landscaping<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Staging<\u002Fspan>\n    <span class=\"tag tag-neutral\" style=\"font-size:16px;padding:10px 20px\">Listing photography<\u002Fspan>\n  <\u002Fdiv>\n  <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Get a real number<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isHow }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 16px;max-width:17ch\">You film it once. We do the rest.<\u002Fh1>\n  <p style=\"font-size:20px;max-width:54ch;margin-bottom:52px\">No site visits to schedule, no five contractors to meet, no quotes to compare on a kitchen table.<\u002Fp>\n  <div style=\"margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;padding:30px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-600)\">1<\u002Fspan><div><h3 style=\"margin-bottom:6px\">Walk the house with your phone<\u002Fh3><p style=\"margin:0;font-size:18px;max-width:56ch\">Every room, the basement, the garage, outside. Say what you are looking at. Two or three minutes is plenty.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;padding:30px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-600)\">2<\u002Fspan><div><h3 style=\"margin-bottom:6px\">We scope it within a day<\u002Fh3><p style=\"margin:0;font-size:18px;max-width:56ch\">A project manager watches the video, prices the work, and sends one itemised page with a target date.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;padding:30px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-600)\">3<\u002Fspan><div><h3 style=\"margin-bottom:6px\">You say yes to the parts you want<\u002Fh3><p style=\"margin:0;font-size:18px;max-width:56ch\">Line by line. Skip the landscaping, keep the paint. The date moves with what you choose.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;padding:30px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-600)\">4<\u002Fspan><div><h3 style=\"margin-bottom:6px\">We book the trades in sequence<\u002Fh3><p style=\"margin:0;font-size:18px;max-width:56ch\">Clear before paint, paint before floors, floors before staging. Getting the order wrong is what costs people weeks.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;padding:30px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-600)\">5<\u002Fspan><div><h3 style=\"margin-bottom:6px\">You watch it happen<\u002Fh3><p style=\"margin:0;font-size:18px;max-width:56ch\">Photos every evening on your own tracking page. Keys and one invoice at the end.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:44px;border-radius:32px;background:var(--color-accent-100)\">\n    <h3 style=\"margin-bottom:8px\">What if I cannot film it?<\u002Fh3>\n    <p style=\"font-size:17px;max-width:56ch;margin:0 0 14px;color:var(--color-accent-900)\">Say so on the form and we will send someone to walk it for you, at no charge, usually within two days.<\u002Fp>\n    <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Start here<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStart }}\">\n<div style=\"max-width:820px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <sc-if value=\"{{ startDone }}\">\n    <div style=\"margin-top:36px;padding:56px;border-radius:36px;background:#17203a;color:#f6f7f9;text-align:center;animation:pn-rise .5s ease both\">\n      <div style=\"width:72px;height:72px;border-radius:999px;background:#f5b13f;color:#17203a;display:grid;place-items:center;font-family:var(--font-heading);font-size:32px;margin:0 auto 24px\">✓<\u002Fdiv>\n      <h2 style=\"color:#f6f7f9;margin-bottom:12px\">We have it.<\u002Fh2>\n      <p style=\"font-size:19px;color:rgba(246,247,249,.75);max-width:46ch;margin:0 auto 28px\">Your job reference is below. A project manager comes back within 24 hours with a scope and a number.<\u002Fp>\n      <div style=\"display:inline-block;padding:16px 34px;border-radius:999px;border:1px solid rgba(246,247,249,.28);font-family:var(--font-heading);font-size:30px;letter-spacing:.06em\">{{ jobId }}<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px\">\n        <a href=\"#/track\" class=\"btn btn-primary\" style=\"text-decoration:none\">Track a property<\u002Fa>\n        <button class=\"btn\" sc-camel-on-click=\"{{ onStartReset }}\" style=\"color:#f6f7f9;border-color:rgba(246,247,249,.28)\" style-hover=\"background:rgba(246,247,249,.1)\">Send another<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ startOpen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <h1 style=\"margin:20px 0 14px\">Send a walkthrough<\u002Fh1>\n    <p style=\"font-size:19px;margin-bottom:40px\">Five questions and a video. Under three minutes.<\u002Fp>\n    <div style=\"display:grid;gap:30px\">\n      <div>\n        <div style=\"font-weight:700;font-size:17px;margin-bottom:12px\">1. Who are you?<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <button class=\"btn\" sc-camel-on-click=\"{{ r.pick }}\" style=\"border:1px solid var(--color-divider);background:{{ r.bg }};color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label style=\"font-size:17px;font-weight:700;color:var(--color-text);margin-bottom:10px\">2. Property address<\u002Flabel>\n        <input class=\"input\" placeholder=\"18 Harcourt Ave, Toronto\" value=\"{{ f.address }}\" sc-camel-on-change=\"{{ setAddress }}\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-weight:700;font-size:17px;margin-bottom:12px\">3. What does it need?<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <sc-for list=\"{{ needs }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <button class=\"btn\" sc-camel-on-click=\"{{ n.toggle }}\" style=\"border:1px solid var(--color-divider);background:{{ n.bg }};color:{{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p class=\"text-muted\" style=\"font-size:15px;margin-top:12px\">Not sure? Leave it blank. That is what the video is for.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label style=\"font-size:17px;font-weight:700;color:var(--color-text);margin-bottom:10px\">4. When does it need to be ready?<\u002Flabel>\n        <input class=\"input\" type=\"date\" value=\"{{ f.date }}\" sc-camel-on-change=\"{{ setDate }}\" style=\"max-width:260px\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-weight:700;font-size:17px;margin-bottom:12px\">5. Your walkthrough video<\u002Fdiv>\n        <label style=\"display:block;padding:40px;border-radius:32px;border:2px dashed var(--color-neutral-400);background:#fff;text-align:center;cursor:pointer\" style-hover=\"border-color:var(--color-accent);background:var(--color-accent-100)\">\n          <input type=\"file\" accept=\"video/*,image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none\">\n          <div style=\"font-family:var(--font-heading);font-size:22px;margin-bottom:6px\">{{ fileLabel }}<\u002Fdiv>\n          <div class=\"text-muted\" style=\"font-size:16px\">Video or photos. Tap to choose from your phone.<\u002Fdiv>\n        <\u002Flabel>\n        <label class=\"radio\" style=\"margin-top:16px;font-size:17px\">\n          <input type=\"checkbox\" checked=\"{{ f.needsVisit }}\" sc-camel-on-change=\"{{ setNeedsVisit }}\"><span class=\"dot\"><\u002Fspan>\n          I cannot film it — please send someone\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label style=\"font-size:17px;font-weight:700;color:var(--color-text);margin-bottom:10px\">How do we reach you?<\u002Flabel>\n        <input class=\"input\" placeholder=\"Name, phone or email\" value=\"{{ f.contact }}\" sc-camel-on-change=\"{{ setContact }}\">\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ onStartSubmit }}\" style=\"min-height:60px;font-size:18px\">Send it to Peanut<\u002Fbutton>\n      <p class=\"text-muted\" style=\"font-size:15px;text-align:center;margin:0\">Nothing is charged and nothing is booked until you accept a written scope.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrack }}\">\n<div style=\"max-width:1000px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 14px\">Track a property<\u002Fh1>\n  <p style=\"font-size:19px;margin-bottom:30px\">Enter the reference from your confirmation. Try <strong>PN-4471<\u002Fstrong> or <strong>PN-4390<\u002Fstrong>.<\u002Fp>\n  <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px\">\n    <input class=\"input\" placeholder=\"PN-0000\" value=\"{{ trackQuery }}\" sc-camel-on-change=\"{{ setTrackQuery }}\" style=\"max-width:240px;text-transform:uppercase\">\n    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onTrack }}\">Look it up<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ trackMiss }}\">\n    <p style=\"font-size:18px\">No property with that reference. Check the letters and numbers, or <a href=\"#/contact\">get in touch<\u002Fa>.<\u002Fp>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ tracked }}\">\n  <div style=\"animation:pn-rise .4s ease both\">\n    <div style=\"padding:36px;border-radius:32px;background:#17203a;color:#f6f7f9;margin-bottom:24px\">\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n        <div>\n          <div style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,247,249,.55);margin-bottom:8px\">{{ tracked.id }}<\u002Fdiv>\n          <h2 style=\"color:#f6f7f9;margin:0\">{{ tracked.address }}<\u002Fh2>\n        <\u002Fdiv>\n        <span class=\"tag\" style=\"background:#f5b13f;color:#17203a;font-size:15px;padding:8px 18px\">{{ tracked.stage }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:12px;border-radius:999px;background:rgba(246,247,249,.15);overflow:hidden;margin:28px 0 12px\">\n        <div style=\"height:100%;background:#f5b13f;width:{{ tracked.pct }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:16px;color:rgba(246,247,249,.6)\"><span>{{ tracked.dayLabel }}<\u002Fspan><span>Target {{ tracked.target }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:22px;margin-bottom:24px\">\n      <div class=\"card elev-sm\" style=\"padding:28px;gap:10px;background:#fff\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Trades<\u002Fspan>\n        <sc-for list=\"{{ tracked.trades }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-size:17px;font-weight:700\">{{ t.name }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:15px\">{{ t.firm }}<\u002Fdiv><\u002Fdiv>\n            <span class=\"tag\" style=\"background:{{ t.bg }};color:{{ t.fg }};white-space:nowrap\">{{ t.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\" style=\"padding:28px;gap:14px;background:#fff\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Your project manager<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <span style=\"width:60px;height:60px;border-radius:999px;background:var(--color-accent-2-200);display:grid;place-items:center;font-family:var(--font-heading);font-size:23px\">{{ tracked.pmInitials }}<\u002Fspan>\n          <div><div style=\"font-size:19px;font-weight:700\">{{ tracked.pm }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:16px\">Answers 8am–7pm<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"tel:+10000000000\" class=\"btn btn-secondary\" style=\"text-decoration:none\">(000) 000-0000<\u002Fa>\n        <a href=\"mailto:hello@peanut.example\" class=\"btn btn-secondary\" style=\"text-decoration:none\">hello@peanut.example<\u002Fa>\n        <div style=\"padding-top:14px;border-top:1px solid var(--color-divider);display:flex;justify-content:space-between;font-size:17px\"><span>Cost to date<\u002Fspan><strong>{{ tracked.cost }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:17px\"><span>Invoice<\u002Fspan><span class=\"text-muted\">{{ tracked.invoice }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"padding:28px;gap:16px;background:#fff\">\n      <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Latest from site<\u002Fspan>\n      <div style=\"display:grid;gap:0\">\n        <div style=\"display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--color-divider)\">\n          <span class=\"text-muted\" style=\"font-size:15px\">Today, 4:52pm<\u002Fspan>\n          <span style=\"font-size:16px\">{{ tracked.note }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--color-divider)\">\n          <span class=\"text-muted\" style=\"font-size:15px\">Yesterday<\u002Fspan>\n          <span style=\"font-size:16px\">Hardware and switch plates off ahead of the painters. Two cracked plates replaced.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--color-divider)\">\n          <span class=\"text-muted\" style=\"font-size:15px\">Sep 24<\u002Fspan>\n          <span style=\"font-size:16px\">Clear-out closed out. Donation receipt filed to the invoice.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\">\n<div style=\"max-width:820px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 20px;max-width:18ch\">We built the thing we kept wishing existed.<\u002Fh1>\n  <p style=\"font-size:20px;margin-bottom:22px\">Everyone in this business knows the same story. A house needs two weeks of work before it can be listed. The owner is eighty, or grieving, or four provinces away. Six trades need to be found, sequenced, let in, checked and paid. Somebody ends up doing it for free, badly, at nine at night.<\u002Fp>\n  <p style=\"font-size:20px;margin-bottom:22px\">Peanut is that job, done properly, by people who do it every day. One scope, one schedule, one invoice, and a page the homeowner can watch from their kitchen table or from another country.<\u002Fp>\n  <p style=\"font-size:20px;margin-bottom:40px\">Agents, brokers and lawyers refer us the property. The client stays in charge of it. That is the whole arrangement.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:20px;margin-bottom:44px\">\n    <div style=\"padding:28px;border-radius:28px;background:var(--color-surface)\"><h4 style=\"margin-bottom:6px\">Licensed and insured trades<\u002Fh4><p style=\"margin:0;font-size:16px\">Every firm we book carries its own coverage. We hold the paperwork.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:28px;border-radius:28px;background:var(--color-surface)\"><h4 style=\"margin-bottom:6px\">Written before it happens<\u002Fh4><p style=\"margin:0;font-size:16px\">No work starts without an accepted scope. No surprises on the invoice.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:28px;border-radius:28px;background:var(--color-surface)\"><h4 style=\"margin-bottom:6px\">Built for older clients<\u002Fh4><p style=\"margin:0;font-size:16px\">Large type, big buttons, a phone number that a person answers.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n    <a href=\"#/start\" class=\"btn btn-primary\" style=\"text-decoration:none\">Send a walkthrough<\u002Fa>\n    <a href=\"#/contact\" class=\"btn btn-secondary\" style=\"text-decoration:none\">Book a call<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\">\n<div style=\"max-width:820px;margin:0 auto;padding:56px 24px 96px\" data-m=\"pad\">\n  <a href=\"#/\" style=\"font-size:15px\">← Home<\u002Fa>\n  <h1 style=\"margin:20px 0 16px\">Talk to a person<\u002Fh1>\n  <p style=\"font-size:20px;margin-bottom:40px\">Phone is fastest. If it is after hours, send the walkthrough and we will call you in the morning.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px;margin-bottom:44px\">\n    <a href=\"tel:+10000000000\" style=\"text-decoration:none;color:inherit;padding:32px;border-radius:28px;background:#17203a;display:block\" style-hover=\"background:#223054\">\n      <div style=\"font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,247,249,.55);margin-bottom:10px\">Phone<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:28px;color:#f6f7f9\">(000) 000-0000<\u002Fdiv>\n      <div style=\"font-size:16px;color:rgba(246,247,249,.6);margin-top:6px\">8am–7pm, seven days<\u002Fdiv>\n    <\u002Fa>\n    <a href=\"mailto:hello@peanut.example\" style=\"text-decoration:none;color:inherit;padding:32px;border-radius:28px;background:var(--color-surface);display:block\" style-hover=\"background:var(--color-neutral-300)\">\n      <div style=\"font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);margin-bottom:10px\">Email<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:24px;word-break:break-all\">hello@peanut.example<\u002Fdiv>\n      <div style=\"font-size:16px;margin-top:6px\" class=\"text-muted\">Answered within one business day<\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n  <h2 style=\"margin-bottom:20px\">Or send it here<\u002Fh2>\n  <sc-if value=\"{{ contactDone }}\">\n    <div style=\"padding:36px;border-radius:28px;background:var(--color-accent-100);animation:pn-rise .4s ease both\">\n      <h3 style=\"margin-bottom:8px\">Message received.<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;color:var(--color-accent-900)\">We will come back to you within one business day.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ contactOpen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:grid;gap:20px;max-width:560px\">\n    <div class=\"field\"><label style=\"font-size:16px\">Your name<\u002Flabel><input class=\"input\" value=\"{{ c.name }}\" sc-camel-on-change=\"{{ setCName }}\"><\u002Fdiv>\n    <div class=\"field\"><label style=\"font-size:16px\">Phone or email<\u002Flabel><input class=\"input\" value=\"{{ c.reach }}\" sc-camel-on-change=\"{{ setCReach }}\"><\u002Fdiv>\n    <div class=\"field\"><label style=\"font-size:16px\">What do you need?<\u002Flabel><textarea class=\"input\" value=\"{{ c.msg }}\" sc-camel-on-change=\"{{ setCMsg }}\"><\u002Ftextarea><\u002Fdiv>\n    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onContactSubmit }}\" style=\"justify-self:start\">Send message<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<footer style=\"background:#17203a;color:rgba(246,247,249,.7);margin-top:0\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:36px\" data-m=\"pad\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\"><img src=\"48786958-715d-40d2-a221-96611f6d0cbb\" alt=\"\" style=\"height:28px;width:auto\"><span style=\"font-family:var(--font-heading);font-size:22px;color:#f6f7f9\">Peanut<\u002Fspan><\u002Fdiv>\n      <p style=\"font-size:16px;margin:0;max-width:32ch\">Property prep for homeowners, agents, estate brokers and counsel.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:16px\">\n      <a href=\"#/services\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Services<\u002Fa>\n      <a href=\"#/how\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">How it works<\u002Fa>\n      <a href=\"#/start\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Send a walkthrough<\u002Fa>\n      <a href=\"#/track\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Track a property<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:16px\">\n      <a href=\"#/refer\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Refer a client<\u002Fa>\n      <a href=\"#/estates\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Estates &amp; legal<\u002Fa>\n      <a href=\"#/about\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">About<\u002Fa>\n      <a href=\"#/contact\" style=\"color:rgba(246,247,249,.7);text-decoration:none\" style-hover=\"color:#f5b13f\">Contact<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:16px\">\n      <div style=\"margin-bottom:8px\">(000) 000-0000<\u002Fdiv>\n      <div style=\"word-break:break-all\">hello@peanut.example<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid rgba(246,247,249,.12)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:20px 24px;font-size:15px;color:rgba(246,247,249,.45)\" data-m=\"pad\">© Peanut. Phone and email shown are placeholders.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst PROPS = {\n  'PN-4471': {\n    id: 'PN-4471', address: '18 Harcourt Ave', stage: 'In progress', pct: '62%',\n    dayLabel: 'Day 7 of 11', target: 'Oct 2', pm: 'Dana Whitfield', pmInitials: 'DW',\n    cost: '$14,280', invoice: 'Issues on completion',\n    note: 'Second coat finished in the front rooms today. Flooring crew confirmed for Tuesday morning; the kitchen subfloor was drier than expected, so no delay.',\n    trades: [\n      { name: 'Clear-out', firm: 'Northgate Removals', status: 'Done', bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-800)' },\n      { name: 'Deep clean', firm: 'Aster Cleaning', status: 'Done', bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-800)' },\n      { name: 'Paint', firm: 'Marchetti & Sons', status: 'On site', bg: '#f5b13f', fg: '#17203a' },\n      { name: 'Flooring', firm: 'Bellwood Floors', status: 'Sep 30', bg: 'var(--color-accent-2-100)', fg: 'var(--color-accent-2-800)' },\n      { name: 'Staging', firm: 'Halliwell Studio', status: 'Oct 1', bg: 'var(--color-accent-2-100)', fg: 'var(--color-accent-2-800)' }\n    ]\n  },\n  'PN-4390': {\n    id: 'PN-4390', address: '92 Ellerslie Cres', stage: 'Punch list', pct: '88%',\n    dayLabel: 'Day 12 of 13', target: 'Sep 26', pm: 'Marcus Oyelaran', pmInitials: 'MO',\n    cost: '$21,940', invoice: 'Draft sent Sep 24',\n    note: 'Punch list walked this morning: two door strikes, one grout line in the main bath, touch-ups on the stair rail. All scheduled for tomorrow before handover.',\n    trades: [\n      { name: 'Clear-out', firm: 'Northgate Removals', status: 'Done', bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-800)' },\n      { name: 'Drywall', firm: 'Pemberton Interiors', status: 'Done', bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-800)' },\n      { name: 'Paint', firm: 'Marchetti & Sons', status: 'Done', bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-800)' },\n      { name: 'Bathroom', firm: 'Verity Plumbing', status: 'Punch list', bg: '#f5b13f', fg: '#17203a' },\n      { name: 'Photography', firm: 'Ruth Kayode', status: 'Sep 27', bg: 'var(--color-accent-2-100)', fg: 'var(--color-accent-2-800)' }\n    ]\n  }\n};\n\nconst ROLE_LIST = ['Homeowner', 'Real estate agent', 'Estate executor', 'Lawyer'];\nconst NEED_LIST = ['Clear-out', 'Painting', 'Flooring', 'Kitchen or bath', 'Landscaping', 'Staging', 'Not sure yet'];\n\nconst EXAMPLE = \"My mother's bungalow in Scarborough. Forty years of contents, carpet in every room, kitchen is original 1978. I'm the executor and I live in Calgary. We want it listed in about six weeks.\";\n\nclass Component extends DCLogic {\n  state = {\n    route: (location.hash || '#/').replace('#', ''),\n    askText: '', askBusy: false, askErr: '', askResult: null,\n    role: '', needs: [], address: '', date: '', contact: '', needsVisit: false,\n    files: 0, startDone: false, jobId: '',\n    trackQuery: '', tracked: null, trackMiss: false,\n    cName: '', cReach: '', cMsg: '', contactDone: false\n  };\n\n  componentDidMount() {\n    this._onHash = () => {\n      this.setState({ route: (location.hash || '#/').replace('#', '') });\n      window.scrollTo(0, 0);\n    };\n    window.addEventListener('hashchange', this._onHash);\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this._onHash); }\n\n  async ask() {\n    const text = this.state.askText.trim();\n    if (!text) { this.setState({ askErr: 'Write a sentence about the property first.' }); return; }\n    this.setState({ askBusy: true, askErr: '', askResult: null });\n    const system = 'You are a project manager at Peanut, a property prep company that gets houses ready to sell. You read a short description and return a realistic prep plan. Be concrete and plain-spoken. Never invent prices. Respond with JSON only, no markdown fence.';\n    const prompt = `Property description:\\n\"\"\"${text}\"\"\"\\n\\nReturn JSON with exactly these keys:\\n{\"who\": one of \"Homeowner\"|\"Real estate agent\"|\"Estate executor\"|\"Lawyer\"|\"Estate broker\",\\n \"plan\": one of \"Clear\"|\"Refresh\"|\"Full Prep\",\\n \"duration\": e.g. \"About 9 working days\",\\n \"headline\": one sentence, max 14 words, saying what this house mainly needs,\\n \"steps\": array of 4-6 objects {\"n\": \"1\", \"trade\": short trade name, \"what\": one sentence of what happens, \"days\": e.g. \"2 days\"} in the correct working sequence,\\n \"watch\": one sentence naming the single thing most likely to delay this job}`;\n    try {\n      const raw = await window.claude.complete({ messages: [{ role: 'user', content: prompt }], system, max_tokens: 1400 });\n      const json = JSON.parse(raw.replace(/^[^{]*/, '').replace(/[^}]*$/, ''));\n      const routes = {\n        'Real estate agent': ['#/refer', 'How referrals work'],\n        'Estate executor': ['#/estates', 'Contents protocol'],\n        'Estate broker': ['#/estates', 'Contents protocol'],\n        'Lawyer': ['#/estates', 'For estates & counsel']\n      };\n      const r = routes[json.who] || ['#/how', 'How it works'];\n      json.route = r[0]; json.routeLabel = r[1];\n      json.steps = (json.steps || []).map((s, i) => Object.assign({}, s, { n: String(i + 1) }));\n      this.setState({ askResult: json, askBusy: false });\n    } catch (e) {\n      this.setState({ askBusy: false, askErr: 'That did not come back cleanly. Try again, or just send the walkthrough and a person will scope it.' });\n    }\n  }\n\n  submitStart() {\n    const n = 4000 + Math.floor(Math.random() * 900);\n    this.setState({ startDone: true, jobId: 'PN-' + n });\n    window.scrollTo(0, 0);\n  }\n\n  lookup() {\n    const key = this.state.trackQuery.trim().toUpperCase();\n    const hit = PROPS[key];\n    this.setState({ tracked: hit || null, trackMiss: !hit });\n  }\n\n  renderVals() {\n    const s = this.state, r = s.route;\n    const chip = (on) => on\n      ? { bg: '#f5b13f', fg: '#17203a' }\n      : { bg: '#ffffff', fg: 'var(--color-text)' };\n\n    return {\n      isHome: r === '/' || r === '' || r === '/home',\n      isRefer: r === '/refer',\n      isEstates: r === '/estates',\n      isServices: r === '/services',\n      isHow: r === '/how',\n      isStart: r === '/start',\n      isTrack: r === '/track',\n      isAbout: r === '/about',\n      isContact: r === '/contact',\n\n      askText: s.askText,\n      onAskText: (e) => this.setState({ askText: e.target.value }),\n      onAskExample: () => this.setState({ askText: EXAMPLE, askErr: '' }),\n      onAsk: () => this.ask(),\n      askBusy: s.askBusy,\n      askLabel: s.askBusy ? 'Working it out…' : 'Show me the plan',\n      askErr: s.askErr,\n      askResult: s.askResult,\n\n      startOpen: !s.startDone,\n      startDone: s.startDone,\n      jobId: s.jobId,\n      onStartSubmit: () => this.submitStart(),\n      onStartReset: () => this.setState({ startDone: false, role: '', needs: [], address: '', date: '', contact: '', files: 0, needsVisit: false }),\n      roles: ROLE_LIST.map((label) => Object.assign({ label, pick: () => this.setState({ role: label }) }, chip(s.role === label))),\n      needs: NEED_LIST.map((label) => Object.assign({\n        label,\n        toggle: () => this.setState((st) => ({ needs: st.needs.includes(label) ? st.needs.filter((x) => x !== label) : st.needs.concat(label) }))\n      }, chip(s.needs.includes(label)))),\n      f: { address: s.address, date: s.date, contact: s.contact, needsVisit: s.needsVisit },\n      setAddress: (e) => this.setState({ address: e.target.value }),\n      setDate: (e) => this.setState({ date: e.target.value }),\n      setContact: (e) => this.setState({ contact: e.target.value }),\n      setNeedsVisit: (e) => this.setState({ needsVisit: e.target.checked }),\n      onFiles: (e) => this.setState({ files: e.target.files ? e.target.files.length : 0 }),\n      fileLabel: s.files ? (s.files === 1 ? '1 file ready to send' : s.files + ' files ready to send') : 'Choose your video',\n\n      trackQuery: s.trackQuery,\n      setTrackQuery: (e) => this.setState({ trackQuery: e.target.value }),\n      onTrack: () => this.lookup(),\n      tracked: s.tracked,\n      trackMiss: s.trackMiss,\n\n      c: { name: s.cName, reach: s.cReach, msg: s.cMsg },\n      setCName: (e) => this.setState({ cName: e.target.value }),\n      setCReach: (e) => this.setState({ cReach: e.target.value }),\n      setCMsg: (e) => this.setState({ cMsg: e.target.value }),\n      contactOpen: !s.contactDone,\n      contactDone: s.contactDone,\n      onContactSubmit: () => this.setState({ contactDone: true })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
